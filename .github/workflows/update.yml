name: Denní aktualizace dat
on:
  schedule:
    - cron: '17 4 * * *'   # každý den v 5:17 SEČ
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stáhnout data
        working-directory: src
        run: ./fetch.sh
      - name: Přepočítat
        working-directory: src
        run: |
          python3 build_data.py
          python3 build_pvp.py
          python3 bosses.py
          python3 events.py
          python3 auto.py | tee ../auto.log
      - name: Nahrát změny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "beze změn"; exit 0; fi
          git commit -m "Automatická aktualizace dat $(date +%Y-%m-%d)" -m "$(cat auto.log)"
          git push
